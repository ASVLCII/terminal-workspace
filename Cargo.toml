[package]
name = "terminal-workspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui_dock = { version = "0.21.1", features = ["serde"] }
egui_term = { path = "vendor/egui_term" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tiny_http = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
arboard = "3"
directories = "6"
tray-icon = "0.24"
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true

[workspace]
members = ["vendor/egui_term"]
